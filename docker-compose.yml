services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pullpanda
      POSTGRES_PASSWORD: pullpanda
      POSTGRES_DB: pullpanda
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pullpanda"]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
volumes:
  pgdata:
